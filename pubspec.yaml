name: lanphone.app
description: "تطبيق مراسلة ومكالمات صوتية ومرئية عبر شبكة الواي فاي المحلية فقط، بدون إنترنت أو شبكات اتصالات."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # === دعم التوطين (العربية) ===
  # ============================================
  flutter_localizations:
    sdk: flutter

  # ============================================
  # === الواجهة (UI) ===
  # ============================================
  cupertino_icons: ^1.0.8

  # ============================================
  # === إدارة الحالة ===
  # ============================================
  provider: ^6.1.2

  # ============================================
  # === الشبكة المحلية ===
  # ============================================
  web_socket_channel: ^3.0.1
  multicast_dns: ^0.3.2+9

  # ============================================
  # === WebRTC ===
  # ============================================
  flutter_webrtc: ^0.14.0

  # ============================================
  # === قاعدة البيانات ===
  # ============================================
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # ============================================
  # === التشفير ===
  # ============================================
  crypto: ^3.0.5
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # ============================================
  # === الأذونات ===
  # ============================================
  permission_handler: ^12.0.0

  # ============================================
  # === التخزين المحلي ===
  # ============================================
  shared_preferences: ^2.3.2

  # ============================================
  # === الوسائط والملفات ===
  # ============================================
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ============================================
  # === معاينة الوسائط ===
  # ============================================
  video_player: ^2.9.2
  open_filex: ^4.5.0

  # ============================================
  # === الإشعارات والمكالمات في الخلفية ===
  # ============================================
  flutter_local_notifications: ^18.0.0
  flutter_callkit_incoming: ^3.1.5

  # ============================================
  # === الصوت ===
  # ============================================
  audio_session: ^0.1.22
  flutter_ringtone_player: ^4.0.0+4

  # ✅ ترقية record إلى الإصدار 6 المباشر
  record: ^5.1.2
  
  just_audio: ^0.9.42

  # ============================================
  # === أدوات مساعدة ===
  # ============================================
  uuid: ^4.5.1
  device_info_plus: ^11.1.0
  android_id: ^0.4.0
  intl: ^0.20.2
  local_auth: ^2.3.0

  # ============================================
  # === QR ===
  # ============================================
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  record_linux: ^1.0.0
  record_platform_interface: ^1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
