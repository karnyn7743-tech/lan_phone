
workflows:
  android-workflow:
    name: LanPhone Android Build

    max_build_duration: 180
    instance_type: mac_mini_m2

    environment:
      flutter: 3.35.0
      java: 17

      vars:
        PACKAGE_NAME: "com.sinan.lanphone"
        ANDROID_NDK_VERSION: "28.2.13676358"
        APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"

    pre_build_script: |
      echo "=== Flutter Version ==="
      flutter --version

      echo "=== Java Version ==="
      java -version

      if [ ! -d "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" ]; then
        echo "Installing NDK $ANDROID_NDK_VERSION..."
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;$ANDROID_NDK_VERSION" || true
      fi

      mkdir -p assets/sounds assets/icons
      touch assets/sounds/.gitkeep assets/icons/.gitkeep

      echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
      echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> android/local.properties

    scripts:
      - name: Clean project
        script: flutter clean

      - name: Get dependencies
        script: flutter pub get

      - name: Check dependencies
        script: flutter pub outdated || true

      - name: Analyze code
        script: |
          flutter analyze || echo "Warnings found, continuing build"

      - name: Build Release APK
        script: |
          flutter build apk \
            --release \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64

      - name: Build Release App Bundle
        script: |
          flutter build appbundle \
            --release \
            --no-shrink

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/symbols/

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
