name: Build LanPhone APK

on:
  push:
    branches: [ main, master, android ]
  pull_request:
    branches: [ main, master, android ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1) استنساخ الكود
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 2) تثبيت Java 17
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================
      # 3) تثبيت Flutter
      # ============================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      # ============================================
      # 4) التحقق من Flutter
      # ============================================
      - name: Verify Flutter
        run: flutter doctor -v

      # ============================================
      # 5) حذف pubspec.lock
      # ============================================
      - name: Remove lock file
        run: rm -f pubspec.lock

      # ============================================
      # 6) تنظيف المشروع
      # ============================================
      - name: Clean project
        run: flutter clean

      # ============================================
      # 7) تنزيل الحزم
      # ============================================
      - name: Get dependencies
        run: flutter pub get

      # ============================================
      # 8) تحليل الكود (تحذيري فقط)
      # ============================================
      - name: Analyze code
        run: flutter analyze || true

      # ============================================
      # 9) بناء APK مع إيقاف الحقن التلقائي
      # ============================================
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64 \
            --no-pub

      # ============================================
      # 10) رفع APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanphone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
